name: Daily Air Quality Dataset Update

on:
  schedule:
    # 03:00 UTC = 08:30 Sri Lanka time, after yesterday's data is complete
    - cron: '0 3 * * *'
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update dataset
        run: python scripts/daily_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): daily air quality update $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
