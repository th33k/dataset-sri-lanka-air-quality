name: Daily Air Quality Dataset Update

on:
  schedule:
    # Once a day, 03:00 Sri Lanka time (21:30 UTC the day before). Off-peak minute:
    # the top of the hour is often delayed by GitHub. Use "Run workflow" if missed.
    - cron: '30 21 * * *'
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update dataset
        run: python scripts/daily_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): daily air quality update $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish new version to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret not set; skipping Kaggle upload."
            exit 0
          fi
          # six: kaggle 2.x imports it but does not declare it as a dependency
          pip install -U kaggle six
          kaggle datasets version -p data/processed -m "Daily update $(date -u +%Y-%m-%d)"
